name: Deploy Service

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      registry:
        required: true
        type: string
      tag_to_deploy:
        required: false
        type: string
        default: "latest"
      namespace:
        required: false
        type: string
        default: "default"
      release-name:
        required: false
        type: string
        default: "my-service"
      helm-chart-path:
        required: true
        type: string  # Path to your Helm chart directory
      aws-region:
        required: true
        type: string
      cluster-name:
        required: true
        type: string

    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ inputs.cluster-name }}" \
            --region "${{ inputs.aws-region }}"

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: latest  # You can pin to a specific version if you prefer

      - name: Deploy service with Helm
        run: |
          # --atomic  : Rolls back automatically on failure
          # --wait    : Waits until all pods are ready
          # --timeout : How long to wait for pods to become ready
          #           (adjust if your app needs longer startup time)

          helm upgrade --install "${{ inputs.release-name }}" "${{ inputs.helm-chart-path }}" \
            --namespace "${{ inputs.namespace }}" \
            --create-namespace \
            --atomic \
            --wait \
            --timeout 5m \
            --set image.repository="${{ inputs.registry }}/${{ inputs.service-name }}" \
            --set image.tag="${{ inputs.tag_to_deploy }}"

      - name: Verify deployment
        run: |
          kubectl rollout status \
            deployment/${{ inputs.release-name }} \
            -n "${{ inputs.namespace }}"