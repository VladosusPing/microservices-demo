name: Deploy Service

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      registry: 
        required: true
        type: string
      tag_to_deploy:
        required: false
        type: string
        default: "latest"

    secrets:
      DOCKER_HUB_ACCESS_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      # Comment Log in to Docker Hub step if repo is public
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_HUB_USER_NAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_KEY }}
      
      