name: Build Service

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      working-dir:
        required: true
        type: string
      registry: 
        required: true
        type: string
      commit_hash:
        required: true
        type: string
    secrets:
      DOCKER_HUB_ACCESS_KEY:
        required: true


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache
          key: ${{ runner.os }}-${{ inputs.service-name }}-${{ inputs.commit_hash }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.service-name }}-

      - name: Log in to Docker Hub
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_HUB_USER_NAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build ${{ inputs.service-name }} Docker Image
        run: |
          docker build \
          --cache-from=type=registry,ref=${{ inputs.registry }}/${{ inputs.service-name }}:latest \
          --cache-to=type=inline \
          -t ${{ inputs.registry }}/${{ inputs.service-name }}:${{ inputs.commit_hash }} \
          .

      - name: Push ${{ inputs.service-name }} Docker image
        run: |
          docker push ${{ inputs.registry }}/${{ inputs.service-name }}:${{ inputs.commit_hash }}

      
      - name: Check if Docker build succeeded
        run: docker images ${{ inputs.registry }}/${{ inputs.service-name }}:${{ inputs.commit_hash }}
